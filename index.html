<!doctype html>
<html lang="en">
  <head>
    <style>
      bolt-ai-badge,
      [data-bolt-badge],
      .bolt-badge,
      #bolt-badge,
      #bolt-badge-container,
      .bolt-badge-container,
      [class*="bolt-badge"],
      [id*="bolt-badge"],
      [data-testid*="bolt"],
      a[href*="bolt.new"],
      a[href*="bolt.new"] *,
      img[src*="bolt.new"],
      iframe[src*="bolt"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        width: 0 !important;
        height: 0 !important;
        max-width: 0 !important;
        max-height: 0 !important;
        min-width: 0 !important;
        min-height: 0 !important;
        overflow: hidden !important;
        pointer-events: none !important;
        position: fixed !important;
        left: -99999px !important;
        top: -99999px !important;
        z-index: -99999 !important;
        clip: rect(0,0,0,0) !important;
      }
    </style>
    <script>
      (function(){
        var H="display:none!important;visibility:hidden!important;opacity:0!important;width:0!important;height:0!important;min-width:0!important;min-height:0!important;max-width:0!important;max-height:0!important;overflow:hidden!important;pointer-events:none!important;position:fixed!important;left:-99999px!important;top:-99999px!important;z-index:-99999!important;clip:rect(0,0,0,0)!important;";
        var S='bolt-ai-badge,[data-bolt-badge],[class*="bolt-badge"],[id*="bolt-badge"],a[href*="bolt.new"],[data-testid*="bolt"],#bolt-badge,#bolt-badge-container,.bolt-badge-container';
        function kill(){
          try{document.querySelectorAll(S).forEach(function(e){e.style.cssText=H;e.setAttribute('hidden','');});}catch(x){}
          try{document.querySelectorAll('*').forEach(function(e){try{if(e.shadowRoot){e.shadowRoot.querySelectorAll(S).forEach(function(s){s.style.cssText=H;s.setAttribute('hidden','');});}}catch(x){}});}catch(x){}
        }
        kill();
        setInterval(kill,100);
        new MutationObserver(kill).observe(document.documentElement,{childList:true,subtree:true,attributes:true,characterData:false});
        document.addEventListener('DOMContentLoaded',kill);
        window.addEventListener('load',kill);
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MandaStrong Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
